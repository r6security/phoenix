# CI: fmt, vet, and unit tests on push and PR.
name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: tidy
        run: go mod tidy

      - name: fmt
        run: |
          go fmt ./...
          git diff --exit-code

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -short -coverprofile=cover.out -count=1
